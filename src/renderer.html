<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Remote Codex</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="title">
        <span class="mark"></span>
        <div>
          <h1>Remote Codex</h1>
          <p id="cwd">启动中...</p>
        </div>
      </div>
      <div class="actions">
        <button id="chooseDir" type="button" data-i18n="openProject">打开项目</button>
        <button id="restart" type="button" data-i18n="restartCodex">重启 Codex</button>
        <button id="captureLogs" type="button" data-i18n="captureLogs">采集日志</button>
        <button id="toggleDebugPanel" type="button" data-i18n="debugPanel">状态调试</button>
        <button id="settings" type="button" data-i18n="settings">设置</button>
      </div>
    </header>

    <main id="terminalShell">
      <section id="terminal"></section>
      <aside id="terminalScrollbar" aria-label="终端滚动历史">
        <div id="terminalScrollSpacer"></div>
      </aside>
    </main>

    <aside id="settingsPanel" class="settings-panel" aria-hidden="true">
      <form id="settingsForm" class="settings-dialog">
        <header class="settings-header">
          <div>
            <h2 data-i18n="settings">设置</h2>
          </div>
          <button id="closeSettings" type="button" data-i18n="close">关闭</button>
        </header>

        <div class="settings-content">
          <section class="settings-section">
            <h3 data-i18n="interface">界面</h3>
            <label>
              <span data-i18n="language">语言</span>
              <select id="uiLanguage" name="uiLanguage">
                <option value="zh-CN" data-i18n="languageChinese">中文</option>
                <option value="en" data-i18n="languageEnglish">English</option>
              </select>
            </label>
            <div class="check-row">
              <input id="debugPanelEnabled" name="debugPanelEnabled" type="checkbox" />
              <label for="debugPanelEnabled" data-i18n="debugPanelEnabled">显示状态调试面板</label>
            </div>
          </section>

          <section class="settings-section">
            <h3>Codex</h3>
            <label>
              <span data-i18n="defaultWorkingDirectory">默认工作目录</span>
              <input id="codexDefaultCwd" name="codexDefaultCwd" type="text" autocomplete="off" />
            </label>
            <div class="check-row">
              <input id="rawOutputLogEnabled" name="rawOutputLogEnabled" type="checkbox" />
              <label for="rawOutputLogEnabled" data-i18n="rawOutputLogEnabled">记录 Codex 原始输出</label>
              <button id="openRawOutputLog" type="button" data-i18n="openLog">打开日志</button>
            </div>
            <div class="check-row">
              <input id="rawOutputLogRecordTerminalControls" name="rawOutputLogRecordTerminalControls" type="checkbox" />
              <label for="rawOutputLogRecordTerminalControls" data-i18n="rawOutputLogRecordTerminalControls">记录终端控制事件</label>
            </div>
          </section>

          <section class="settings-section">
            <h3>Feishu</h3>
            <div class="connect-box">
              <div class="connect-copy">
                <strong data-i18n="connection">连接</strong>
                <span id="feishuConnectState">未连接。</span>
              </div>
              <div class="connect-actions">
                <button id="connectFeishu" type="button">连接飞书</button>
                <button id="openFeishuConnect" type="button" disabled data-i18n="openLink">打开链接</button>
                <button id="cancelFeishuConnect" type="button" disabled data-i18n="cancel">取消</button>
              </div>
              <img id="feishuConnectQr" alt="" hidden />
              <p id="feishuConnectLink"></p>
            </div>
            <p class="settings-help" data-i18n="feishuBotMenuHint"></p>
          </section>
        </div>

        <footer class="settings-footer">
          <span id="settingsStatus" role="status"></span>
          <div>
            <button type="submit" data-i18n="save">保存</button>
          </div>
        </footer>
      </form>
    </aside>

    <aside id="captureLogPanel" class="capture-log-panel" aria-hidden="true">
      <section class="capture-log-dialog">
        <header class="capture-log-header">
          <div>
            <h2 data-i18n="captureLogs">采集日志</h2>
            <p id="captureLogPath"></p>
          </div>
          <div class="capture-log-header-actions">
            <button id="refreshCaptureLogs" type="button" data-i18n="refresh">刷新</button>
            <button id="openCaptureLogFile" type="button" data-i18n="openRawFile">打开原始文件</button>
            <button id="closeCaptureLogs" type="button" data-i18n="close">关闭</button>
          </div>
        </header>
        <div class="capture-log-toolbar">
          <label>
            <span data-i18n="session">会话</span>
            <select id="captureLogSession"></select>
          </label>
          <label>
            <span data-i18n="eventType">事件类型</span>
            <select id="captureLogType"></select>
          </label>
          <label class="capture-log-auto-refresh">
            <input id="captureLogAutoRefresh" type="checkbox" checked />
            <span data-i18n="autoRefresh">自动刷新</span>
          </label>
          <label class="capture-log-auto-refresh">
            <input id="captureLogIncludeNoise" type="checkbox" />
            <span data-i18n="includeTerminalControls">显示终端控制事件</span>
          </label>
          <span id="captureLogStatus" role="status"></span>
        </div>
        <div id="captureLogStats" class="capture-log-stats"></div>
        <div class="capture-log-body">
          <ol id="captureLogEvents" class="capture-log-events"></ol>
          <section class="capture-log-detail">
            <header>
              <h3 id="captureLogDetailTitle" data-i18n="selectEvent">选择事件查看详情</h3>
              <div class="capture-log-tabs">
                <button class="is-active" id="captureLogContentTab" type="button" data-i18n="content">内容</button>
                <button id="captureLogMetadataTab" type="button" data-i18n="metadata">元数据</button>
              </div>
            </header>
            <pre id="captureLogDetail"></pre>
          </section>
        </div>
      </section>
    </aside>

    <aside id="debugPanel" class="debug-panel" aria-hidden="true">
      <header>
        <div>
          <h2 data-i18n="debugPanel">状态调试</h2>
          <p id="debugPanelUpdated">--</p>
        </div>
        <button id="closeDebugPanel" type="button" data-i18n="close">关闭</button>
      </header>
      <div id="debugPanelBody" class="debug-panel-body"></div>
    </aside>

    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
